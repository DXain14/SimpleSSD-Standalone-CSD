#
# Minimal workload that reaches CSD read_compute through:
# RequestGenerator -> BlockIOEntry -> Scheduler -> NVMe::Driver::submitIO.
#

[global]
Mode = 0
LogPeriod = 0
LogFile = STDOUT
DebugLogFile =
LatencyLogFile =
ProgressPeriod = 0
Interface = 1
Scheduler = 0
SubmissionLatency = 5us
CompletionLatency = 5us

[generator]
io_size = 64
readwrite = readcompute
rwmixread = 0.5
blocksize = 512
blockalign = 512
iomode = sync
iodepth = 1
offset = 0
size =
thinktime = 0
randseed = 13245
time_based = 0
runtime = 10s
csd_matrix_slba = 0
csd_rows = 4
csd_cols = 4
csd_matrix_count = 2
csd_vector_seed = 7
csd_opcode = 0xC0
csd_use_sgl = 0
csd_prewrite_matrix = 1
csd_verify_output = 1

[trace]
File = ./test/csd_trace_readcompute.txt
TimingMode = 0
QueueDepth = 1
IOLimit = 0
Regex = ".*"
Operation =
ByteOffset =
ByteLength =
LBAOffset =
LBALength =
Second =
Millisecond =
Microsecond =
Nanosecond =
Picosecond =
LBASize = 512
UseHexadecimal = 0
MatrixSLBA =
Rows =
Cols =
VectorSeed =
MatrixSeed =
CSDOpcode = 0xC0
CSDUseSGL = 0
CSDVerifyOutput = 0
